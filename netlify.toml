[build]
  command = "npm run build"
  publish = "public"  # ← пока оставляем

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"   # ← ИЗМЕНЕНО: /index.html вместо /index.php
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"